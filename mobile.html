<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大德语录卡片</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 15px;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .header h1 {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }
        
        /* 卡片预览区域 */
        .card-preview-wrapper {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .card {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 12px;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        
        /* 模板样式 */
        .card.template-classic {
            background: linear-gradient(135deg, #fdfbf7 0%, #e8dcc8 100%);
        }
        
        .card.template-modern {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card.template-zen {
            background: linear-gradient(135deg, #e8e0d5 0%, #c9c0b0 100%);
        }
        
        .card.template-warm {
            background: linear-gradient(135deg, #fff5eb 0%, #ffe8d6 100%);
        }
        
        .card.template-dark {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
        }
        
        .card-text {
            font-size: 20px;
            line-height: 1.8;
            text-align: center;
            color: #333;
            font-family: "Noto Serif SC", serif;
        }
        
        .card-author {
            font-size: 14px;
            text-align: right;
            color: #666;
            margin-top: 20px;
        }
        
        .card.template-modern .card-text,
        .card.template-dark .card-text {
            color: #fff;
        }
        
        .card.template-modern .card-author,
        .card.template-dark .card-author {
            color: rgba(255,255,255,0.8);
        }
        
        .card.template-warm .card-text {
            color: #7a4a2a;
        }
        
        .card.template-warm .card-author {
            color: #a67c52;
        }
        
        .card.template-zen .card-text {
            color: #4a4035;
        }
        
        /* 模板选择 */
        .template-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding: 5px 0;
            -webkit-overflow-scrolling: touch;
        }
        
        .template-selector::-webkit-scrollbar {
            display: none;
        }
        
        .template-item {
            flex-shrink: 0;
            width: 70px;
            height: 90px;
            border-radius: 10px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }
        
        .template-item.active {
            border-color: #667eea;
            transform: scale(1.05);
        }
        
        .template-item.template-classic {
            background: linear-gradient(135deg, #fdfbf7 0%, #e8dcc8 100%);
        }
        
        .template-item.template-modern {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .template-item.template-zen {
            background: linear-gradient(135deg, #e8e0d5 0%, #c9c0b0 100%);
        }
        
        .template-item.template-warm {
            background: linear-gradient(135deg, #fff5eb 0%, #ffe8d6 100%);
        }
        
        .template-item.template-dark {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
        }
        
        /* 文字编辑区域 */
        .editor-section {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }
        
        .editor-section textarea,
        .editor-section input {
            width: 100%;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 15px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .editor-section textarea:focus,
        .editor-section input:focus {
            border-color: #667eea;
        }
        
        .editor-section textarea {
            min-height: 100px;
            line-height: 1.6;
        }
        
        .editor-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            display: block;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group:last-child {
            margin-bottom: 0;
        }
        
        /* 语录选择 */
        .quotes-section {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }
        
        .quotes-section h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        .quotes-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .quote-option {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .quote-option:hover {
            background: #f0f3ff;
            border-color: #667eea;
        }
        
        .quote-option small {
            display: block;
            color: #999;
            margin-top: 5px;
            font-size: 12px;
        }
        
        /* 底部按钮 */
        .bottom-bar {
            position: sticky;
            bottom: 15px;
            display: flex;
            gap: 12px;
        }
        
        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-download:active {
            transform: scale(0.98);
        }
        
        .btn-back {
            background: #f0f0f0;
            color: #333;
        }
        
        /* 返回链接 */
        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回语录</a>
        
        <div class="header">
            <h1>大德语录卡片</h1>
        </div>
        
        <!-- 卡片预览 -->
        <div class="card-preview-wrapper">
            <div id="card" class="card template-classic">
                <div class="card-content">
                    <p class="card-text" id="cardText">阿弥陀佛，佛光普照</p>
                </div>
                <p class="card-author" id="cardAuthor">— 大德语录</p>
            </div>
        </div>
        
        <!-- 模板选择 -->
        <div class="template-selector">
            <div class="template-item template-classic active" data-template="classic"></div>
            <div class="template-item template-modern" data-template="modern"></div>
            <div class="template-item template-zen" data-template="zen"></div>
            <div class="template-item template-warm" data-template="warm"></div>
            <div class="template-item template-dark" data-template="dark"></div>
        </div>
        
        <!-- 文字编辑 -->
        <div class="editor-section">
            <div class="input-group">
                <label class="editor-label">语录内容</label>
                <textarea id="quoteInput" placeholder="输入语录内容...">阿弥陀佛，佛光普照</textarea>
            </div>
            <div class="input-group">
                <label class="editor-label">作者</label>
                <input type="text" id="authorInput" value="— 大德语录">
            </div>
        </div>
        
        <!-- 语录选择 -->
        <div class="quotes-section">
            <h3>💡 选择语录</h3>
            <div class="quotes-list" id="quotesList">
                <!-- 语录会动态加载 -->
            </div>
        </div>
        
        <!-- 底部按钮 -->
        <div class="bottom-bar">
            <a href="index.html" class="btn btn-back" style="text-align: center; text-decoration: none; display: block;">返回</a>
            <button class="btn btn-download" id="downloadBtn">📥 保存图片</button>
        </div>
    </div>
    
    <script>
        let currentTemplate = 'classic';
        
        // 模板选择
        document.querySelectorAll('.template-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.template-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentTemplate = item.dataset.template;
                
                const card = document.getElementById('card');
                card.className = `card template-${currentTemplate}`;
            });
        });
        
        // 更新文字
        document.getElementById('quoteInput').addEventListener('input', () => {
            document.getElementById('cardText').textContent = document.getElementById('quoteInput').value;
        });
        
        document.getElementById('authorInput').addEventListener('input', () => {
            document.getElementById('cardAuthor').textContent = document.getElementById('authorInput').value;
        });
        
        // 下载图片
        document.getElementById('downloadBtn').addEventListener('click', async () => {
            const card = document.getElementById('card');
            try {
                const canvas = await html2canvas(card, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: null
                });
                
                const link = document.createElement('a');
                link.download = `大德语录_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (e) {
                alert('保存失败，请重试');
            }
        });
        
        // 加载语录
        async function loadQuotes() {
            const teachers = ['印光大师', '净空法师', '其他大德'];
            const allQuotes = [];
            
            for (const teacher of teachers) {
                try {
                    const response = await fetch(`${teacher}.txt`);
                    const text = await response.text();
                    const lines = text.trim().split('\n').filter(line => line.trim());
                    lines.forEach(line => {
                        allQuotes.push({ text: line.trim(), teacher: teacher });
                    });
                } catch (e) {
                    console.log(`加载 ${teacher} 失败`);
                }
            }
            
            // 显示语录
            const list = document.getElementById('quotesList');
            allQuotes.forEach(quote => {
                const item = document.createElement('div');
                item.className = 'quote-option';
                item.innerHTML = `${quote.text}<small>— ${quote.teacher}</small>`;
                item.addEventListener('click', () => {
                    document.getElementById('quoteInput').value = quote.text;
                    document.getElementById('authorInput').value = `— ${quote.teacher}`;
                    document.getElementById('cardText').textContent = quote.text;
                    document.getElementById('cardAuthor').textContent = `— ${quote.teacher}`;
                });
                list.appendChild(item);
            });
        }
        
        loadQuotes();
    </script>
</body>
</html>
