<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大德语录卡片</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 12px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        /* 顶部导航 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .back-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        .header h1 {
            font-size: 17px;
            color: #333;
            font-weight: 600;
        }
        
        /* 模板选择 */
        .template-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding: 2px 0;
            -webkit-overflow-scrolling: touch;
        }
        
        .template-selector::-webkit-scrollbar {
            display: none;
        }
        
        .template-item {
            flex-shrink: 0;
            width: 50px;
            height: 65px;
            border-radius: 8px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }
        
        .template-item.active {
            border-color: #667eea;
            transform: scale(1.05);
        }
        
        .template-item.template-classic { background: linear-gradient(135deg, #fdfbf7 0%, #e8dcc8 100%); }
        .template-item.template-modern { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .template-item.template-zen { background: linear-gradient(135deg, #e8e0d5 0%, #c9c0b0 100%); }
        .template-item.template-warm { background: linear-gradient(135deg, #fff5eb 0%, #ffe8d6 100%); }
        .template-item.template-dark { background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); }
        
        /* 画布容器 */
        .canvas-wrapper {
            background: #fff;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        
        #canvas-container {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .hint-text {
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-top: 8px;
        }
        
        /* 语录选择 */
        .quotes-section {
            background: #fff;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }
        
        .quotes-section h3 {
            font-size: 13px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .quotes-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .quote-option {
            padding: 10px 12px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .quote-option:active {
            background: #f0f3ff;
            border-color: #667eea;
        }
        
        .quote-option small {
            display: block;
            color: #999;
            margin-top: 4px;
            font-size: 11px;
        }
        
        /* 底部按钮 */
        .bottom-bar {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.25);
        }
        
        .btn-download:active {
            transform: scale(0.98);
        }
        
        .btn-reset {
            background: #f0f0f0;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link">← 返回</a>
            <h1>语录卡片</h1>
            <div style="width:40px"></div>
        </div>
        
        <!-- 模板选择 -->
        <div class="template-selector">
            <div class="template-item template-classic active" data-template="classic"></div>
            <div class="template-item template-modern" data-template="modern"></div>
            <div class="template-item template-zen" data-template="zen"></div>
            <div class="template-item template-warm" data-template="warm"></div>
            <div class="template-item template-dark" data-template="dark"></div>
        </div>
        
        <!-- 画布 -->
        <div class="canvas-wrapper">
            <div id="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
            <p class="hint-text">💡 双击文字可编辑，拖动可移动/缩放</p>
        </div>
        
        <!-- 语录选择 -->
        <div class="quotes-section">
            <h3>选择语录</h3>
            <div class="quotes-list" id="quotesList"></div>
        </div>
        
        <!-- 底部按钮 -->
        <div class="bottom-bar">
            <button class="btn btn-reset" id="resetBtn">重置</button>
            <button class="btn btn-download" id="downloadBtn">保存图片</button>
        </div>
    </div>
    
    <script>
        let canvas;
        let quoteTextObj;
        let quoteAuthorObj;
        let currentTemplate = 'classic';
        
        const templates = {
            classic: { bgColor: '#fdfbf7', textColor: '#333', authorColor: '#666' },
            modern: { bgColor: '#667eea', textColor: '#fff', authorColor: 'rgba(255,255,255,0.8)' },
            zen: { bgColor: '#e8e0d5', textColor: '#4a4035', authorColor: 'rgba(74,64,53,0.6)' },
            warm: { bgColor: '#fff5eb', textColor: '#7a4a2a', authorColor: '#a67c52' },
            dark: { bgColor: '#2c3e50', textColor: '#fff', authorColor: 'rgba(255,255,255,0.8)' }
        };
        
        function initCanvas() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = width * 4 / 3;
            
            canvas = new fabric.Canvas('canvas', {
                width: width,
                height: height,
                backgroundColor: templates.classic.bgColor
            });
            
            quoteTextObj = new fabric.IText('阿弥陀佛，佛光普照', {
                left: 25,
                top: height * 0.3,
                fontSize: 34,
                fill: templates.classic.textColor,
                textAlign: 'center',
                fontFamily: '"Noto Serif SC", serif',
                selectable: true,
                editable: true,
                lineHeight: 1.6
            });
            
            quoteAuthorObj = new fabric.IText('— 大德语录', {
                left: width - 110,
                top: height - 70,
                fontSize: 18,
                fill: templates.classic.authorColor,
                textAlign: 'right',
                selectable: true,
                editable: true,
                fontFamily: '"Noto Serif SC", serif'
            });
            
            canvas.add(quoteTextObj);
            canvas.add(quoteAuthorObj);
        }
        
        document.querySelectorAll('.template-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.template-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentTemplate = item.dataset.template;
                const t = templates[currentTemplate];
                
                canvas.setBackgroundColor(t.bgColor, canvas.renderAll.bind(canvas));
                quoteTextObj.set('fill', t.textColor);
                quoteAuthorObj.set('fill', t.authorColor);
                canvas.renderAll();
            });
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('确定要重置吗？')) {
                canvas.clear();
                initCanvas();
                document.querySelector('.template-item').classList.add('active');
            }
        });
        
        document.getElementById('downloadBtn').addEventListener('click', () => {
            canvas.discardActiveObject();
            canvas.renderAll();
            const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
            const link = document.createElement('a');
            link.download = `大德语录_${Date.now()}.png`;
            link.href = dataURL;
            link.click();
        });
        
        async function loadQuotes() {
            const teachers = ['印光大师', '净空法师', '其他大德'];
            const allQuotes = [];
            
            for (const teacher of teachers) {
                try {
                    const response = await fetch(`${teacher}.txt`);
                    const text = await response.text();
                    text.trim().split('\n').filter(line => line.trim()).forEach(line => {
                        allQuotes.push({ text: line.trim(), teacher: teacher });
                    });
                } catch (e) {}
            }
            
            const list = document.getElementById('quotesList');
            allQuotes.forEach(quote => {
                const item = document.createElement('div');
                item.className = 'quote-option';
                item.innerHTML = `${quote.text}<small>— ${quote.teacher}</small>`;
                item.addEventListener('click', () => {
                    quoteTextObj.setText(quote.text);
                    quoteAuthorObj.setText(`— ${quote.teacher}`);
                    canvas.renderAll();
                });
                list.appendChild(item);
            });
        }
        
        initCanvas();
        loadQuotes();
    </script>
</body>
</html>
